[project]
name = "call-center-intelligence"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "langchain-google-genai>=4.3.5",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "mutagen>=1.48.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "reportlab>=4.0.0",
    "sqlalchemy>=2.0.52",
    "gradio>=5.0",
    "soundfile>=0.13.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.12.0",
    "pre-commit>=4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
